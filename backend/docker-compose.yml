services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: laravel-app
        container_name: laravel-app
        volumes:
            - .:/var/www
        depends_on:
            - postgres
            - manticore
        restart: always
        deploy:
            resources:
                limits:
                    cpus: "2"
                    memory: 1.5G
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:9000 || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
        networks:
            - samed-tsj

    nginx:
        image: nginx:alpine
        container_name: nginx
        volumes:
            - .:/var/www
            - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
        environment:
            - VIRTUAL_HOST=${VIRTUAL_HOST}
            - VIRTUAL_PORT=${VIRTUAL_PORT}
            - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
            - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
        depends_on:
            - app
        restart: always
        deploy:
            resources:
                limits:
                    cpus: "1"
                    memory: 512M
        healthcheck:
            test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
            interval: 30s
            timeout: 10s
            retries: 3
        networks:
            - samed-tsj

    postgres:
        image: postgres:15
        container_name: postgres
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "${DB_PORT_EXT}:${DB_PORT}"
        volumes:
            - pgdata:/var/lib/postgresql/data
        restart: always
        deploy:
            resources:
                limits:
                    cpus: "2"
                    memory: 1.5G
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
            interval: 30s
            timeout: 10s
            retries: 5
        networks:
            - samed-tsj

    manticore:
        image: manticoresearch/manticore:latest
        container_name: manticore
        volumes:
            - manticore_data:/var/lib/manticore
            - manticore_config:/etc/manticore
        environment:
            - MANTICORE_MEMORY_LIMIT=512M
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "2.0"
                    memory: 1500M
        networks:
            - samed-tsj

volumes:
    pgdata:
    manticore_data:
    manticore_config:

networks:
    samed-tsj:
